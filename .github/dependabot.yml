version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Dubai"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"
      runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  # Intentionally vulnerable test fixture for `lyrie hack` scanner integration
  # tests (tests/hack/integration.test.ts asserts exact CVE-affected versions,
  # e.g. express === "4.17.1"). Do NOT let Dependabot bump these — bumping
  # breaks the scanner's own detection tests. See fixture package.json header.
  - package-ecosystem: "npm"
    directory: "/tests/hack/fixtures/vulnerable-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels: ["dependencies", "ignore-intentional-fixture"]

  - package-ecosystem: "cargo"
    directory: "/packages/shield"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "shield"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
