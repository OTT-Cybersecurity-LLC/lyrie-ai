name: SDK Python Publish (PyPI)

on:
  push:
    tags:
      - 'sdk-py-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. sdk-py-v0.3.0)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build + publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lyrie-agent
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build
        run: python -m build

      - name: Verify with twine
        run: python -m twine check dist/*

      # Token-based publish (primary) — requires PYPI_API_TOKEN secret
      - name: Publish to PyPI (token)
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --skip-existing dist/*

      # Trusted publishing fallback (OIDC) — only if token not set
      # Requires: pypi.org → Account → Publishing → Add Trusted Publisher
      #   owner: OTT-Cybersecurity-LLC | repo: lyrie-ai
      #   workflow: sdk-python-publish.yml | environment: pypi
      - name: Publish to PyPI (trusted publishing fallback)
        if: ${{ secrets.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
          skip-existing: true
