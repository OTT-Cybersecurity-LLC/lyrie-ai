name: SDK Python Publish (PyPI)

on:
  push:
    tags:
      - 'sdk-py-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. sdk-py-v0.3.0)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build + publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lyrie-agent
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build
        run: python -m build

      - name: Verify with twine
        run: python -m twine check dist/*

      # Publish to PyPI using PYPI_API_TOKEN secret
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::warning::PYPI_API_TOKEN not set — skipping publish."
            exit 0
          fi
          python -m twine upload --skip-existing dist/*
