name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.14'  # pinned for stability
      - run: bun install --frozen-lockfile

      # Build publishable packages (skip UI/shield which are not on npm)
      - name: Build packages
        run: bunx turbo run build --filter=./packages/core --filter=./packages/gateway --filter=./packages/mcp

      # Publish each package separately from its own directory
      # NOTE: Requires @lyrie npm org to exist at npmjs.com and NPM_TOKEN with publish rights
      - name: Publish packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN secret not set; skipping publish."
            exit 0
          fi
          PUBLISH_FAILED=0
          for pkg in packages/core packages/gateway packages/mcp; do
            echo "--- Publishing $pkg ---"
            pushd "$pkg" > /dev/null
            NAME=$(node -p "require('./package.json').name")
            VERSION=$(node -p "require('./package.json').version")
            if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
              echo "::notice::${NAME}@${VERSION} already published, skipping."
            else
              PUBLISH_OUTPUT=$(npm publish --provenance --access public 2>&1)
              PUBLISH_STATUS=$?
              echo "$PUBLISH_OUTPUT"
              if [ $PUBLISH_STATUS -eq 0 ]; then
                echo "::notice::Published ${NAME}@${VERSION} successfully."
              elif echo "$PUBLISH_OUTPUT" | grep -q 'E404'; then
                # E404 on @lyrie scope = org not created yet — warn, don't fail the release
                echo "::warning::${NAME}@${VERSION} — @lyrie npm org not yet created. Create org at npmjs.com then re-run."
              elif echo "$PUBLISH_OUTPUT" | grep -q 'You cannot publish over the previously published versions'; then
                # Version already live on the registry (e.g. published outside this workflow) — not a real failure
                echo "::notice::${NAME}@${VERSION} already live on npm registry, skipping."
              else
                echo "::error::Failed to publish ${NAME}@${VERSION}"
                PUBLISH_FAILED=1
              fi
            fi
            popd > /dev/null
          done
          if [ $PUBLISH_FAILED -eq 1 ]; then
            echo "::error::One or more npm packages failed to publish."
            exit 1
          fi
          echo "::notice::npm publish step complete (org-missing/already-published warnings are non-blocking)."

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: python3 -m pip install --upgrade build twine
      - name: Build sdist + wheel
        working-directory: sdk/python
        run: python3 -m build
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        working-directory: sdk/python
        run: |
          if [ -z "${TWINE_PASSWORD}" ]; then
            echo "::warning::PYPI_API_TOKEN secret not set; skipping publish."
            exit 0
          fi
          NAME=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if pip index versions "${NAME}" 2>/dev/null | grep -q "${VERSION}"; then
            echo "::notice::${NAME}==${VERSION} already published on PyPI, skipping."
          else
            if python3 -m twine upload dist/* 2>&1 | tee /tmp/twine.log; then
              echo "::notice::Published ${NAME}==${VERSION} to PyPI successfully."
            elif grep -q 'File already exists' /tmp/twine.log; then
              echo "::notice::${NAME}==${VERSION} already live on PyPI, skipping."
            else
              echo "::error::Failed to publish ${NAME}==${VERSION} to PyPI."
              exit 1
            fi
          fi

  build-binaries:
    name: Build Binary (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: lyrie-aarch64-apple-darwin.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: lyrie-x86_64-apple-darwin.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: lyrie-x86_64-unknown-linux-musl.tar.gz
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            artifact: lyrie-aarch64-unknown-linux-musl.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: lyrie-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.14'
      - run: bun install --frozen-lockfile
      - name: Build with Bun (single-file)
        shell: bash
        run: |
          mkdir -p dist
          bun build packages/core/src/index.ts --compile --outfile "dist/lyrie" --target "${{ matrix.target == 'x86_64-pc-windows-msvc' && 'bun-windows-x64' || matrix.target == 'aarch64-apple-darwin' && 'bun-darwin-arm64' || matrix.target == 'x86_64-apple-darwin' && 'bun-darwin-x64' || matrix.target == 'aarch64-unknown-linux-musl' && 'bun-linux-arm64-musl' || 'bun-linux-x64-musl' }}" || echo "::warning::compile target may need adjustment"
      - name: Package
        shell: bash
        run: |
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "../${{ matrix.artifact }}" lyrie* || true
          else
            tar -czf "../${{ matrix.artifact }}" lyrie* || true
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: warn

  github-release:
    name: GitHub Release
    needs: [build-binaries]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
